<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSMP Tournament</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background: #17212b;
            color: white;
            margin: 0;
        }
        input {
            padding: 12px;
            width: 80%;
            font-size: 17px;
            margin: 20px 0;
            border-radius: 8px;
            border: none;
        }
        button {
            padding: 14px 32px;
            font-size: 17px;
            margin: 10px;
            border-radius: 8px;
            background: #00aaff;
            color: white;
            border: none;
        }
        .profile {
            margin-top: 30px;
        }
        img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #00aaff;
        }
    </style>
</head>
<body>

<!-- Экран регистрации -->
<div id="registerScreen">
    <h2>Регистрация в турнире</h2>
    <p>Аватарка будет взята из Telegram</p>
    <input id="nickname" placeholder="Ваш никнейм" maxlength="20"><br><br>
    <button onclick="registerUser()">Зарегистрироваться</button>
</div>

<!-- Экран профиля -->
<div id="profileScreen" style="display: none;" class="profile">
    <h2>Профиль</h2>
    <img id="avatar" src="" alt="Аватар"><br><br>
    <h3 id="nicknameText"></h3>
    <p>ID: <span id="userIdText"></span></p>
    <button onclick="tg.close()">Закрыть</button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const user = tg.initDataUnsafe?.user;
const userId = user?.id?.toString();

if (!userId) {
    document.body.innerHTML = "<h3>Ошибка: Откройте приложение через Telegram</h3>";
}

// Регистрация
async function registerUser() {
    const nicknameInput = document.getElementById("nickname");
    const nickname = nicknameInput.value.trim();

    if (!nickname) {
        alert("Пожалуйста, введите никнейм!");
        return;
    }

    // Отправляем данные
    tg.sendData(JSON.stringify({
        action: "register",
        user_id: userId,
        nickname: nickname,
        avatar: user.photo_url || null
    }));

    // Сразу показываем профиль
    showProfile(nickname, user.photo_url);
}

// Показ профиля
function showProfile(nickname, avatarUrl) {
    document.getElementById("registerScreen").style.display = "none";
    document.getElementById("profileScreen").style.display = "block";

    document.getElementById("nicknameText").textContent = nickname;
    document.getElementById("userIdText").textContent = userId;
    
    document.getElementById("avatar").src = avatarUrl || "https://via.placeholder.com/130?text=No+Photo";
}

// При загрузке показываем только форму регистрации (убрали автоматический sendData)
window.onload = () => {
    // Ничего не отправляем автоматически
};
</script>

</body>
</html>
