<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSMP Tournament</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background: #17212b;
            color: white;
        }
        .error { color: #ff6666; margin: 20px; }
    </style>
</head>
<body>

<div id="content">
    <h2>Загрузка...</h2>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const user = tg.initDataUnsafe?.user;
const userId = user?.id?.toString();

function showError() {
    document.getElementById("content").innerHTML = `
        <h2 class="error">⚠️ Откройте приложение через Telegram</h2>
        <p>Пожалуйста, зайдите в бота и нажмите кнопку "Открыть приложение".</p>
    `;
}

if (!userId) {
    showError();
} else {
    // Нормальная загрузка
    document.getElementById("content").innerHTML = `
        <h2>Регистрация в турнире</h2>
        <p>Аватарка будет взята из вашего Telegram</p>
        <input id="nickname" placeholder="Ваш никнейм" maxlength="20" style="padding:12px; width:80%; font-size:17px; margin:15px 0; border-radius:8px;"><br><br>
        <button onclick="registerUser()" style="padding:14px 32px; font-size:17px; background:#00aaff; color:white; border:none; border-radius:8px;">Зарегистрироваться</button>
    `;
}

async function registerUser() {
    const nickname = document.getElementById("nickname").value.trim();
    if (!nickname) return alert("Введите никнейм!");

    tg.sendData(JSON.stringify({
        action: "register",
        user_id: userId,
        nickname: nickname,
        avatar: user.photo_url || null
    }));

    // Показываем профиль сразу
    document.getElementById("content").innerHTML = `
        <div class="profile" style="margin-top:30px;">
            <h2>Профиль создан!</h2>
            <img src="${user.photo_url || 'https://via.placeholder.com/130'}" 
                 style="width:130px;height:130px;border-radius:50%;border:3px solid #00aaff;object-fit:cover;"><br><br>
            <h3>${nickname}</h3>
            <p>ID: ${userId}</p>
            <button onclick="tg.close()" style="padding:12px 30px;">Закрыть</button>
        </div>
    `;
}
</script>

</body>
</html>
