<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<h2>Регистрация</h2>

<input id="nickname" placeholder="Никнейм"><br><br>
<input type="file" id="avatar"><br><br>

<button onclick="send()">Зарегистрироваться</button>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

async function send() {
    const nickname = document.getElementById("nickname").value.trim();
    const file = document.getElementById("avatar").files[0];

    if (!nickname) {
        return alert("Введите никнейм!");
    }

    tg.sendData(JSON.stringify({
        action: "register",
        nickname: nickname,
        avatar: file ? await toBase64(file) : null
    }));

    // Можно закрыть WebApp после отправки
    // tg.close();
}

function toBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}
</script>

</body>
</html>
