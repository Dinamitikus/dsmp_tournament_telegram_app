<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSMP</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 20px;
            background: #17212b;
            color: white;
        }
        h2 { color: #00aaff; }
    </style>
</head>
<body>

    <h2>Мини-приложение загружено</h2>
    <p>Если ты это видишь — приложение работает.</p>
    <br>
    <button onclick="registerTest()">Тест регистрации</button>

<script>
const tg = window.Telegram.WebApp;
tg.expand();
tg.ready();           // ← Важно добавить

console.log("Mini App запущен успешно");

async function registerTest() {
    tg.sendData(JSON.stringify({
        action: "register",
        nickname: "ТестовыйНик",
        avatar: tg.initDataUnsafe?.user?.photo_url || null
    }));
    alert("Данные отправлены!");
}
</script>

</body>
</html>
