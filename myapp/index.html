<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSMP Tournament</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        input { padding: 10px; width: 80%; margin: 10px 0; font-size: 16px; }
        button { padding: 12px 24px; font-size: 16px; margin: 10px; }
        .profile { margin-top: 20px; }
        img { border-radius: 50%; width: 120px; height: 120px; object-fit: cover; }
    </style>
</head>
<body>

<div id="registration" style="display: none;">
    <h2>Регистрация</h2>
    <input id="nickname" placeholder="Ваш никнейм" maxlength="20"><br><br>
    <button onclick="register()">Зарегистрироваться</button>
</div>

<div id="profile" style="display: none;" class="profile">
    <h2>Профиль</h2>
    <img id="avatar" src="" alt="Аватар">
    <h3 id="nick"></h3>
    <p>ID: <span id="user_id"></span></p>
    <button onclick="tg.close()">Закрыть</button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const user = tg.initDataUnsafe.user;
const userId = user.id.toString();

async function loadUser() {
    // Отправляем запрос на проверку/регистрацию
    tg.sendData(JSON.stringify({
        action: "get_or_register",
        user_id: userId,
        first_name: user.first_name,
        username: user.username,
        photo_url: user.photo_url || null
    }));
}

async function register() {
    const nickname = document.getElementById("nickname").value.trim();
    
    if (!nickname) {
        return alert("Введите никнейм!");
    }

    tg.sendData(JSON.stringify({
        action: "register",
        user_id: userId,
        nickname: nickname,
        photo_url: user.photo_url || null
    }));
}

// Получаем ответ от бота
tg.onEvent('viewportChanged', () => {});
window.addEventListener('message', (event) => {
    // Telegram иногда использует postMessage
});

async function showProfile(data) {
    document.getElementById("registration").style.display = "none";
    document.getElementById("profile").style.display = "block";

    document.getElementById("nick").textContent = data.nickname;
    document.getElementById("user_id").textContent = userId;
    
    const avatarImg = document.getElementById("avatar");
    avatarImg.src = data.avatar || "https://via.placeholder.com/120";
}

// При загрузке
window.onload = () => {
    loadUser();
};

// Слушаем данные от бота
tg.onEvent('web_app_data_sent', () => {}); // не используется
</script>

</body>
</html>
