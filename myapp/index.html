<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSMP Tournament</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background: #17212b;
            color: white;
            margin: 0;
        }
        input {
            padding: 12px;
            width: 80%;
            font-size: 17px;
            margin: 15px 0;
            border-radius: 8px;
            border: none;
        }
        button {
            padding: 14px 32px;
            font-size: 17px;
            margin: 10px;
            border-radius: 8px;
            background: #00aaff;
            color: white;
            border: none;
        }
        .profile {
            margin-top: 30px;
        }
        img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #00aaff;
        }
    </style>
</head>
<body>

<div id="content">
    <h2>Регистрация в турнире</h2>
    <p>Аватарка будет взята из Telegram</p>
    <input id="nickname" placeholder="Ваш никнейм" maxlength="20"><br><br>
    <button onclick="registerUser()">Зарегистрироваться</button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const user = tg.initDataUnsafe?.user || {};
const userId = user.id ? user.id.toString() : "test_user_" + Date.now(); // для теста

async function registerUser() {
    const nickname = document.getElementById("nickname").value.trim();

    if (!nickname) {
        return alert("Введите никнейм!");
    }

    tg.sendData(JSON.stringify({
        action: "register",
        user_id: userId,
        nickname: nickname,
        avatar: user.photo_url || null
    }));

    // Сразу показываем профиль
    document.getElementById("content").innerHTML = `
        <div class="profile">
            <h2>Профиль создан!</h2>
            <img src="${user.photo_url || 'https://i1.sndcdn.com/artworks-oGvaMt0dsBWPL7WZ-qgbAMA-t500x500.jpg'}" alt="Аватар"><br><br>
            <h3>${nickname}</h3>
            <p>ID: ${userId}</p>
            <button onclick="tg.close()">Закрыть приложение</button>
        </div>
    `;
}
</script>

</body>
</html>
