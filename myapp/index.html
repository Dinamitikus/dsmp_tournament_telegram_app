<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSMP Tournament</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background: #17212b;
            color: white;
            margin: 0;
        }
        input, button {
            padding: 12px;
            margin: 10px;
            font-size: 17px;
            border-radius: 8px;
        }
        input { width: 80%; border: none; }
        button { 
            background: #00aaff; 
            color: white; 
            border: none; 
            padding: 14px 32px;
        }
        .profile img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px solid #00aaff;
            object-fit: cover;
        }
        .version { position: fixed; bottom: 10px; right: 10px; font-size: 12px; color: #666; }
    </style>
</head>
<body>

<div id="content">
    <h2>Загрузка...</h2>
</div>

<div class="version">v1.6</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const user = tg.initDataUnsafe?.user || {};
const userId = user.id ? user.id.toString() : "test_" + Date.now();

console.log("Mini App opened. User ID:", userId);

// При открытии сразу проверяем профиль
window.onload = () => {
    tg.sendData(JSON.stringify({ action: "get_profile", user_id: userId }));
    
    // Если бот не ответил быстро — показываем регистрацию
    setTimeout(() => {
        if (document.getElementById("content").innerHTML.includes("Загрузка")) {
            showRegister();
        }
    }, 1000);
};

function showRegister() {
    document.getElementById("content").innerHTML = `
        <h2>Регистрация</h2>
        <p>Аватарка из Telegram</p>
        <input id="nickname" placeholder="Никнейм" maxlength="20"><br><br>
        <button onclick="registerUser()">Зарегистрироваться</button>
    `;
}

function registerUser() {
    const nickname = document.getElementById("nickname").value.trim();
    if (!nickname) return alert("Введите никнейм!");

    tg.sendData(JSON.stringify({
        action: "register",
        user_id: userId,
        nickname: nickname,
        avatar_url: user.photo_url || null
    }));

    showProfile(nickname, user.photo_url);
}

function showProfile(nickname, avatarUrl) {
    document.getElementById("content").innerHTML = `
        <div class="profile">
            <h2>Профиль</h2>
            <img src="${avatarUrl || 'https://via.placeholder.com/140'}" alt="avatar"><br><br>
            <h3>${nickname}</h3>
            <p>ID: ${userId}</p>
        </div>
    `;
}

// По умолчанию
showRegister();
</script>

</body>
</html>
