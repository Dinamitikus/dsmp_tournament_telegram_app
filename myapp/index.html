<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSMP Tournament</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background: #17212b;
            color: white;
            margin: 0;
        }
        input {
            padding: 12px;
            width: 80%;
            font-size: 17px;
            margin: 15px 0;
            border-radius: 8px;
            border: none;
        }
        button {
            padding: 14px 32px;
            font-size: 17px;
            margin: 10px;
            border-radius: 8px;
            background: #00aaff;
            color: white;
            border: none;
        }
        .profile {
            margin-top: 30px;
        }
        img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #00aaff;
        }
        .version {
            position: fixed;
            bottom: 10px;
            right: 10px;
            font-size: 12px;
            color: #555;
        }
    </style>
</head>
<body>

<div id="content">
    <h2>Загрузка...</h2>
</div>

<div class="version">v1.2</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const user = tg.initDataUnsafe?.user || {};
const userId = user.id ? user.id.toString() : "test_" + Date.now();

// При открытии сразу спрашиваем у бота статус
window.onload = () => {
    tg.sendData(JSON.stringify({
        action: "get_profile",
        user_id: userId
    }));
};

async function registerUser() {
    const nickname = document.getElementById("nickname").value.trim();
    if (!nickname) return alert("Введите никнейм!");

    tg.sendData(JSON.stringify({
        action: "register",
        user_id: userId,
        nickname: nickname,
        avatar_url: user.photo_url || null
    }));

    // Сразу показываем профиль
    showProfile(nickname, user.photo_url);
}

function showProfile(nickname, avatarUrl) {
    document.getElementById("content").innerHTML = `
        <div class="profile">
            <h2>Профиль</h2>
            <img src="${avatarUrl || 'https://via.placeholder.com/140?text=No+Avatar'}" alt="Аватар"><br><br>
            <h3>${nickname}</h3>
            <p>ID: ${userId}</p>
            <button onclick="tg.close()">Закрыть</button>
        </div>
    `;
}

// Показываем форму регистрации
function showRegister() {
    document.getElementById("content").innerHTML = `
        <h2>Регистрация в турнире</h2>
        <p>Аватарка будет взята из Telegram</p>
        <input id="nickname" placeholder="Ваш никнейм" maxlength="20"><br><br>
        <button onclick="registerUser()">Зарегистрироваться</button>
    `;
}

// По умолчанию показываем форму
showRegister();
</script>

</body>
</html>
