<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSMP Tournament</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #17212b; color: white; }
        input { padding: 12px; width: 80%; font-size: 17px; margin: 15px 0; border-radius: 8px; }
        button { padding: 14px 32px; font-size: 17px; background: #00aaff; color: white; border: none; border-radius: 8px; }
        .profile { margin-top: 30px; }
        img { width: 130px; height: 130px; border-radius: 50%; border: 3px solid #00aaff; object-fit: cover; }
    </style>
</head>
<body>

<div id="content">
    <h2>Регистрация в турнире</h2>
    <p>Аватарка будет взята из Telegram</p>
    <input id="nickname" placeholder="Ваш никнейм" maxlength="20"><br><br>
    <button onclick="registerUser()">Зарегистрироваться</button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const user = tg.initDataUnsafe?.user || {};
const userId = user.id ? user.id.toString() : "test_" + Date.now();

// ←←←←←←←←← ИЗМЕНИ НА СВОЙ URL ←←←←←←←←←
const BACKEND_URL = "https://dinamitikus.pythonanywhere.com";  

async function registerUser() {
    const nickname = document.getElementById("nickname").value.trim();
    if (!nickname) return alert("Введите никнейм!");

    const payload = {
        action: "register",
        user_id: userId,
        nickname: nickname,
        avatar: user.photo_url || null
    };

    try {
        const response = await fetch(BACKEND_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (response.ok) {
            showProfile(nickname, user.photo_url);
        } else {
            alert("Ошибка сервера");
        }
    } catch (e) {
        alert("Не удалось подключиться к серверу. Проверь URL.");
        console.error(e);
    }
}

function showProfile(nickname, avatarUrl) {
    document.getElementById("content").innerHTML = `
        <div class="profile">
            <h2>Профиль создан!</h2>
            <img src="${avatarUrl || 'https://via.placeholder.com/130?text=Avatar'}" alt="Аватар"><br><br>
            <h3>${nickname}</h3>
            <p>ID: ${userId}</p>
            <button onclick="tg.close()">Закрыть приложение</button>
        </div>
    `;
}
</script>
</body>
</html>
